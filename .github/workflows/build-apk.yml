name: Build & Release APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: 读取版本号（version.json）
        id: ver
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          VERSION_CODE="${{ github.run_number }}"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "📦 版本：v${VERSION_NAME} (code=${VERSION_CODE})"

      - name: 应用版本号到 app/build.gradle
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: 生成签名文件
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS:   ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS:    ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS:     ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 RELEASE_KEYSTORE_BASE64 Secret"
            exit 1
          fi
          KS="${RUNNER_TEMP}/release.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$KS"
          if [ ! -s "$KS" ]; then
            echo "::error::keystore 解码失败"
            exit 1
          fi
          chmod 600 "$KS"

          # keystore.properties（绝对路径）
          cat > keystore.properties <<EOF
          storeFile=$KS
          storePassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          chmod 600 keystore.properties
          echo "✅ keystore 与 keystore.properties 已生成"

      - name: 构建 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 重命名 APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::未找到 Release APK"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi
          DST="Slanzou-v${VERSION_NAME}.apk"
          cp "$SRC" "$DST"
          echo "name=${DST}" >> "$GITHUB_OUTPUT"
          ls -lh "$DST"
          # 验证签名
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$DST" || true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          TAG="v${VERSION_NAME}"
          # 同名 tag 已存在则先删（workflow_dispatch 重复触发场景）
          gh release delete "${TAG}" --yes 2>/dev/null || true
          git push origin --delete "${TAG}" 2>/dev/null || true
          git tag -d "${TAG}" 2>/dev/null || true

          gh release create "${TAG}" \
            --target "${{ github.sha }}" \
            --title "Slanzou ${TAG}" \
            --notes "**自动构建**
          - versionName: \`${VERSION_NAME}\`
          - versionCode: \`${{ steps.ver.outputs.code }}\`
          - 构建时间: $(date -u '+%Y-%m-%d %H:%M UTC')
          - 提交: [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          - 系统要求：Android 7.0+ (API 24+)
          " \
            --latest \
            "${APK_NAME}"
